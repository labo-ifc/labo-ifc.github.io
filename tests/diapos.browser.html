<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>diapos : vérification navigateur</title>
<style>
  body { font: 16px/1.4 monospace; margin: 12px; background: #fff; color: #000; }
  .pass { color: #067d17; } .fail { color: #c00; font-weight: bold; }
  iframe { width: 1280px; height: 800px; border: 1px solid #999; }
  h1 { font-size: 20px; }
</style>
</head>
<body>
<h1 id="summary">running…</h1>
<ol id="log"></ol>
<iframe id="f"></iframe>
<script>
// In-browser check of diapos/ (via the local server: /tests/diapos.browser.html).
// Clears the editor's saved deck first, so it starts from the default presentation.
localStorage.removeItem("diapos:deck");
const results = [];
const check = (name, ok) => results.push([name, !!ok]);
const f = document.getElementById("f");
f.src = "../diapos/";
// Runs synchronously in the iframe's load handler, so it completes before the parent's load (screenshot time).
f.addEventListener("load", run);

function run() {
  const d = f.contentDocument, w = f.contentWindow;
  const $ = (s) => d.querySelector(s);
  const els = () => d.querySelectorAll("#stage-frame .slide > .el");
  const click = (s) => $(s).click();
  try {
    check("default deck: one slide, two blocks", d.querySelectorAll("#thumbs li").length === 1 && els().length === 2);
    check("stage is scaled to fit", $("#stage-frame").getBoundingClientRect().width > 300);

    click('[data-insert="text"]');
    check("insert text adds a selected block", els().length === 3 && $(".selection"));
    check("inspector shows the text field", $("#prop-text"));

    click('[data-insert="formula"]');
    check("formula is drawn with KaTeX", $("#stage-frame .el-formula .katex"));
    const tex = $("#prop-tex");
    tex.value = "\\ce{2H2 + O2 -> 2H2O}";
    tex.dispatchEvent(new Event("input"));
    check("mhchem formula renders", $("#stage-frame .el-formula .katex") && !$("#stage-frame .el-formula .katex-error"));

    click('[data-insert="shape:arrow"]');
    check("arrow drawn as svg", $("#stage-frame .el-shape svg polygon"));
    check("five blocks", els().length === 5);

    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    check("Ctrl+Z removes the arrow", els().length === 4);
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, shiftKey: true, bubbles: true }));
    check("Ctrl+Shift+Z brings it back", els().length === 5);

    $("#add-menu").open = true;
    $("#layout-menu button:nth-child(2)").click();
    check("new slide added and shown", d.querySelectorAll("#thumbs li").length === 2 && els().length === 2);
    click('[data-slide="duplicate"]');
    check("duplicate slide", d.querySelectorAll("#thumbs li").length === 3);
    click('[data-slide="delete"]');
    check("delete slide", d.querySelectorAll("#thumbs li").length === 2);

    $("#thumbs li:first-child button").click();
    check("back to slide 1", els().length === 5 && $("#slide-counter").textContent.startsWith("Diapo 1"));

    $("#stage-frame").dispatchEvent(new w.PointerEvent("pointerdown", { bubbles: true, button: 0 }));
    const cards = d.querySelectorAll(".theme-cards button");
    check("theme cards in inspector when nothing is selected", cards.length === 4);
    cards[3].click();
    const bg = w.getComputedStyle($("#stage-frame .slide")).backgroundColor;
    check("blackboard theme recolours the slide", bg === "rgb(36, 64, 47)");

    click("#present");
    check("presenter opens on the current slide", !$("#presenter").hidden && $("#present-count").textContent === "1 / 2");
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
    check("arrow goes to the next slide", $("#present-count").textContent === "2 / 2");
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    check("Escape closes the presenter", $("#presenter").hidden);

    click('[data-insert="graph"]');
    const curves = () => d.querySelectorAll("#stage-frame .el-graph path.curve");
    check("graph drawn as svg with a curve", curves().length === 1);
    check("graph legend rendered with KaTeX", $("#stage-frame .el-graph .graph-legend .katex"));
    const fn = $(".fn-row input");
    fn.value = "1/x";
    fn.dispatchEvent(new Event("input"));
    check("1/x drawn in two pieces", curves()[0]?.getAttribute("d").split("M").length === 3);
    fn.value = "2x+";
    fn.dispatchEvent(new Event("input"));
    check("invalid expression: message, no curve", $(".fn-error").textContent && curves().length === 0);
    [...d.querySelectorAll(".inspector button")].find((b) => b.textContent === "+ Courbe").click();
    check("+ Courbe adds a second row", d.querySelectorAll(".fn-row").length === 2);
    const xmin = $('[data-prop="xmin"]');
    xmin.value = "10";
    xmin.dispatchEvent(new Event("input"));
    check("xmin ≥ xmax is refused", $("#window-error").textContent && xmin.classList.contains("invalid"));
    xmin.value = "-2,5";
    xmin.dispatchEvent(new Event("input"));
    check("decimal comma accepted", !$("#window-error").textContent);

    // Multiple selection and alignment (slide with title, text and graph).
    const key = (k, opts = {}) => d.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true, ...opts }));
    const ptr = (type, target, x, y, opts = {}) => target.dispatchEvent(new w.PointerEvent(type, { bubbles: true, button: 0, clientX: x, clientY: y, pointerId: 1, ...opts }));
    $("#stage-frame").dispatchEvent(new w.PointerEvent("pointerdown", { bubbles: true, button: 0 }));
    key("a", { ctrlKey: true });
    check("Ctrl+A selects every block", d.querySelectorAll(".overlay .selection.multi").length === els().length && $(".group-box"));
    check("multi panel lists the blocks", $(".inspector h2").textContent === `${els().length} blocs sélectionnés`);
    check("no resize handles for several blocks", !$(".overlay .handle"));
    $('[data-align="left"]').click();
    const lefts = [...els()].map((n) => Math.round(n.getBoundingClientRect().left));
    check("align left lines up the blocks", lefts.every((v) => Math.abs(v - lefts[0]) <= 1));
    key("z", { ctrlKey: true });
    check("align is one undo step", new Set([...els()].map((n) => Math.round(n.getBoundingClientRect().left))).size > 1);
    // Spread the three blocks apart first (no overlap), then distribute.
    const field = (label, value) => {
      const input = [...d.querySelectorAll(".inspector .grid4 label")].find((l) => l.firstChild.textContent === label).querySelector("input");
      input.value = value;
      input.dispatchEvent(new Event("input"));
    };
    [[100, 40], [200, 300], [300, 700]].forEach(([x, y], i) => {
      ptr("pointerdown", els()[i], 0, 0);
      ptr("pointerup", $("#stage-frame"), 0, 0);
      field("X", x); field("Y", y); field("Largeur", 600); field("Hauteur", 100); field("Rotation °", 0);
    });
    key("a", { ctrlKey: true });
    $('[data-distribute="y"]').click();
    const tops = [...els()].map((n) => n.getBoundingClientRect()).sort((a, b) => a.top - b.top);
    check("distribute vertically: equal gaps", Math.abs((tops[1].top - tops[0].bottom) - (tops[2].top - tops[1].bottom)) < 1.5);

    key("Escape");
    const r = $("#stage-frame").getBoundingClientRect();
    ptr("pointerdown", $("#stage-frame"), r.left + 2, r.top + 2);
    ptr("pointermove", $("#stage-frame"), r.right - 2, r.bottom - 2);
    ptr("pointerup", $("#stage-frame"), r.right - 2, r.bottom - 2);
    check("marquee over the whole slide selects all", d.querySelectorAll(".overlay .selection.multi").length === els().length && !$(".marquee"));

    const first = els()[0];
    ptr("pointerdown", first, 0, 0, { shiftKey: true });
    check("Shift+click removes a block from the selection", d.querySelectorAll(".overlay .selection.multi").length === els().length - 1);
    ptr("pointerdown", first, 0, 0, { shiftKey: true });
    check("Shift+click adds it back", d.querySelectorAll(".overlay .selection.multi").length === els().length);

    const before = [...els()].map((n) => n.getBoundingClientRect().left);
    const b = els()[1].getBoundingClientRect();
    ptr("pointerdown", els()[1], b.left + 5, b.top + 5, { altKey: true });
    ptr("pointermove", $("#stage-frame"), b.left + 45, b.top + 5, { altKey: true });
    ptr("pointerup", $("#stage-frame"), b.left + 45, b.top + 5, { altKey: true });
    const after = [...els()].map((n) => n.getBoundingClientRect().left);
    check("dragging moves the whole selection", after.every((v, i) => Math.abs(v - before[i] - 40) < 1.5));

    key("ArrowRight", { shiftKey: true });
    const nudged = [...els()].map((n) => n.getBoundingClientRect().left);
    check("arrows nudge every selected block", nudged.every((v, i) => v > after[i]));
    key("Delete");
    check("Delete removes the selected blocks", els().length === 0);
    key("z", { ctrlKey: true });
    check("undo brings them back", els().length === 3);

    w.dispatchEvent(new w.Event("pagehide"));
    const saved = JSON.parse(localStorage.getItem("diapos:deck") || "null");
    check("deck saved in localStorage", saved && saved.slides.length === 2 && saved.theme === "tableau");
    const graph = saved?.slides.flatMap((s) => s.elements).find((e) => e.type === "graph");
    check("graph saved with its window", graph && graph.xmin === -2.5 && graph.fns.length === 2);
    report();
  } catch (e) {
    check("exception: " + e.message, false);
    report();
  }
}

function report() {
  const log = document.getElementById("log");
  for (const [name, ok] of results) {
    const li = document.createElement("li");
    li.className = ok ? "pass" : "fail";
    li.textContent = (ok ? "✓ " : "✗ ") + name;
    log.append(li);
  }
  const failed = results.filter((r) => !r[1]).length;
  document.getElementById("summary").textContent = failed ? `${failed} échec(s) sur ${results.length}` : `OK : ${results.length} vérifications`;
}
</script>
</body>
</html>
